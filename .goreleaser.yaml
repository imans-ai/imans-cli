version: 2

project_name: imans

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: imans
    binary: imans
    main: ./cmd/imans
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/imans-ai/imans-cli/internal/version.Version={{ .Version }}
      - -X github.com/imans-ai/imans-cli/internal/version.Commit={{ .Commit }}
      - -X github.com/imans-ai/imans-cli/internal/version.BuildDate={{ .Date }}
      - -X github.com/imans-ai/imans-cli/internal/version.SchemaVersion={{ .Env.SCHEMA_VERSION }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    # Explicit, predictable names so scripts/install.sh can compute the asset
    # URL: imans_<version>_<os>_<arch>.<ext> (e.g. imans_0.1.0_linux_amd64.tar.gz).
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# Pushing formulae/manifests to the tap repos below needs write access to OTHER
# repositories than this one, so the default GITHUB_TOKEN is not sufficient.
# Provide a PAT as the HOMEBREW_TAP_GITHUB_TOKEN repository secret (used for both).
homebrew_casks:
  - repository:
      owner: imans-ai
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: imans-release-bot
      email: bot@imans.ai
    homepage: https://github.com/imans-ai/imans-cli
    description: Official CLI for the Imans public API.
    # The binary is not notarized (signing intentionally deferred), so strip the
    # quarantine attribute on install to avoid a Gatekeeper block on first run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/imans"]
          end

scoops:
  - repository:
      owner: imans-ai
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: imans-release-bot
      email: bot@imans.ai
    homepage: https://github.com/imans-ai/imans-cli
    description: Official CLI for the Imans public API.
    license: Apache-2.0
