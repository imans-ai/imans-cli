name: release

# Cuts a release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# GoReleaser builds the cross-platform archives, publishes a GitHub Release with
# checksums, and updates the Homebrew tap and Scoop bucket.

on:
  push:
    tags:
      - "v*"

# Process releases one at a time so concurrent tag pushes don't race on the
# Homebrew/Scoop repository updates.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (with the tag in a comment) so a moved or
      # compromised tag can't alter this write-privileged release workflow.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          # GoReleaser authenticates via the tokens in env below; don't leave the
          # checkout credentials around for later steps.
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
          # Build releases from a clean module cache (avoids cache poisoning).
          cache: false

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Creates the GitHub Release on this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to imans-ai/homebrew-tap and imans-ai/scoop-bucket.
          # Falls back to GITHUB_TOKEN so a release without the secret still builds
          # archives (the brew/scoop push step is what needs the PAT).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          # Stamped into `imans version`. Set the SCHEMA_VERSION repo variable to
          # the API contract version to enable the CLI's version-mismatch warning;
          # left empty the warning is disabled (no false positives).
          SCHEMA_VERSION: ${{ vars.SCHEMA_VERSION }}
